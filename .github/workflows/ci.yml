# This is a basic workflow to help you get started with Actions

name: CI

# Runs on pushes to master and release branches, and on every pull request whatever its base
# branch, so a PR stacked on another PR's branch still gets checks.
on:
  push:
    branches:
      - master
      - release*
  pull_request:

jobs:
  test:
    strategy:
      # Report every leg; one workspace failing says nothing about the other two.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        # dir is where bazel runs; slug is a path-free name for cache keys.
        workspace:
          - { dir: ., slug: root }
          - { dir: test/test_workspace, slug: tw }
          - { dir: kramer, slug: kramer }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the Android SDK components test_workspace pins
        # Must match test_workspace's android_sdk_repository (api_level / build_tools_version).
        # Runs before setup-java because the image's sdkmanager needs the image's default
        # (newer) JDK.
        if: matrix.workspace.slug == 'tw'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Mount maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ matrix.workspace.slug }}-${{ hashFiles('**/WORKSPACE', '**/*.bzl', 'maven/kramer-resolve.jar') }}
          restore-keys: |
            m2-${{ runner.os }}-${{ matrix.workspace.slug }}-
            m2-${{ runner.os }}-
      - name: Setup bazelisk for Bazel builds
        uses: bazelbuild/setup-bazelisk@v3
      - name: Build ${{ matrix.workspace.dir }}
        run: (cd ${{ matrix.workspace.dir }} && bazel build //...)
      - name: Test ${{ matrix.workspace.dir }}
        run: (cd ${{ matrix.workspace.dir }} && bazel test //...)
