# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches:
      - master
      - release*
  pull_request:
    branches: [ master ]

jobs:
  test:
    strategy:
      # Report every leg; one workspace failing says nothing about the other two.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        workspace:
          - .
          - test/test_workspace
          - kramer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Mount maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ matrix.workspace }}-${{ hashFiles('**/WORKSPACE', '**/*.bzl', 'maven/kramer-resolve.jar') }}
          restore-keys: |
            m2-${{ runner.os }}-${{ matrix.workspace }}-
            m2-${{ runner.os }}-
      - name: Setup bazelisk for Bazel builds
        uses: bazelbuild/setup-bazelisk@v3
      - name: Build ${{ matrix.workspace }}
        run: (cd ${{ matrix.workspace }} && bazel build //...)
      - name: Test ${{ matrix.workspace }}
        run: (cd ${{ matrix.workspace }} && bazel test //...)
